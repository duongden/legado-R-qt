<article class="lm-page lm-manuscript">
  <header class="lm-console">
    <div class="lm-console-seal" aria-hidden="true">{{dial}}</div>
    <div class="lm-console-copy"><span class="lm-kicker">RECORDS ABOVE THE GRAY FOG</span><strong data-reader-field="bookName"></strong><span data-reader-field="chapterTitle"></span></div>
    <div class="lm-mini-card" aria-hidden="true"><div class="lm-tarot-art"></div><span class="lm-card-mark">0</span></div>
  </header>
  <div class="lm-bookline"><span class="lm-star" aria-hidden="true">✦</span><span class="lm-card-name">愚者</span><i class="lm-card-english">THE FOOL</i></div>
  <section class="lm-paper"><div class="lm-corners" aria-hidden="true">{{corners}}</div><main class="lm-flow" data-reader-flow="body" data-reader-flow-pagination="columns"></main></section>
  {{footer}}
</article>
