<article class="lm-page lm-opening">
  <header class="lm-hero">
    <div class="lm-crimson-moon" aria-hidden="true"></div>
    <div class="lm-astral-dial" aria-hidden="true">{{dial}}</div>
    <div class="lm-skyline" aria-hidden="true">{{skyline}}</div>
    <div class="lm-mist" aria-hidden="true"></div>
    <div class="lm-hero-rule"><span>THE TAROT CLUB</span><i></i><span>SEFIRAH CASTLE</span></div>
    <div class="lm-oracle-number" aria-hidden="true">0</div>
    <div class="lm-hero-copy"><span class="lm-kicker lm-oracle-english">THE FOOL</span><strong class="lm-oracle-title">愚者</strong><span class="lm-hero-subtitle lm-oracle-keywords">启程 · 自由 · 无限可能</span><span class="lm-motto">命运始于尚未踏出的那一步。</span></div>
    <div class="lm-opening-spread" aria-hidden="true">
      <div class="lm-companion-card lm-companion-far"><div class="lm-tarot-art"></div></div>
      <div class="lm-companion-card lm-companion-near"><div class="lm-tarot-art"></div></div>
      <div class="lm-opening-card"><div class="lm-tarot-art"></div></div>
    </div>
    <div class="lm-hero-caption"><span class="lm-phase-label">绯红长夜</span><b>✦</b><span class="lm-opening-caption">ARCANA / 0</span></div>
  </header>
  <div class="lm-bookline"><span class="lm-star" aria-hidden="true">✦</span><span data-reader-field="bookName"></span><i>THE FIRST REVELATION</i></div>
  <section class="lm-paper"><div class="lm-corners" aria-hidden="true">{{corners}}</div><main class="lm-flow" data-reader-flow="body" data-reader-flow-pagination="columns"></main></section>
  {{footer}}
</article>
