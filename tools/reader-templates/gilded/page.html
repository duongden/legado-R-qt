<article class="gilded-page {{pageClass}}">
  <div class="gilded-border" aria-hidden="true"></div>
  <div class="gilded-corner gilded-nw" aria-hidden="true">{{corner}}</div>
  <div class="gilded-corner gilded-ne" aria-hidden="true">{{corner}}</div>
  <div class="gilded-corner gilded-sw" aria-hidden="true">{{corner}}</div>
  <div class="gilded-corner gilded-se" aria-hidden="true">{{corner}}</div>
  <div class="gilded-vine gilded-vine-left" aria-hidden="true">{{vine}}</div>
  <div class="gilded-vine gilded-vine-right" aria-hidden="true">{{vine}}</div>
  <div class="gilded-bookmark" aria-hidden="true"><i></i><b>✧</b></div>
  <header class="gilded-masthead">
    <div class="gilded-heading">
      <span class="gilded-kicker" aria-hidden="true">F L O R I L E G I U M</span>
      <span class="gilded-book" data-reader-field="bookName"></span>
      <span class="gilded-running" data-reader-field="chapterTitle"></span>
      <span class="gilded-header-rule" aria-hidden="true">{{fleur}}</span>
    </div>
    <div class="gilded-cameo" aria-hidden="true"><div class="gilded-portrait"></div><span class="gilded-cameo-star">✧</span></div>
    <span class="gilded-pin" aria-hidden="true">✦</span>
    <span class="gilded-shimmer" aria-hidden="true"></span>
  </header>
  <section class="gilded-body" data-reader-flow="body" data-reader-flow-pagination="columns"></section>
  <footer class="gilded-footer">
    <div class="gilded-footer-left"><span class="gilded-footer-label" aria-hidden="true">時 · 光</span><span data-reader-field="time"></span></div>
    <div class="gilded-folio"><span class="gilded-folio-wing" aria-hidden="true">{{fleur}}</span><span data-reader-field="page"></span><span class="gilded-folio-wing gilded-mirror" aria-hidden="true">{{fleur}}</span></div>
    <div class="gilded-footer-right"><span class="gilded-footer-label" aria-hidden="true">書 · 程</span><span data-reader-field="progress"></span></div>
    <div class="gilded-progress" aria-hidden="true"><i></i></div>
  </footer>
  <div class="gilded-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</article>
