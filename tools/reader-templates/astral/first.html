<article class="st-page st-opening">
  <div class="st-edge-stars" aria-hidden="true"></div>
  <header class="st-hero">
    <div class="st-firmament" aria-hidden="true">{{starfield}}</div>
    <div class="st-aurora" aria-hidden="true"></div>
    <div class="st-orrery" aria-hidden="true">{{astrolabe}}</div>
    <div class="st-meteor" aria-hidden="true"></div>
    <div class="st-hero-index"><span>CELESTIAL LIBRARY</span><i></i><span>VOL. ∞</span></div>
    <div class="st-hero-copy"><span class="st-eyebrow">THE NIGHT IS A BOOK</span><strong>ASTRAL<br><em>ARCHIVE</em></strong><span class="st-hero-cn">星 穹 · 天 文 馆</span></div>
    <div class="st-hero-caption"><span>每一个故事，都是尚未命名的星辰。</span><b>✦</b></div>
    <div class="st-horizon" aria-hidden="true"></div>
  </header>
  <div class="st-bookline"><span class="st-small-star" aria-hidden="true">✧</span><span data-reader-field="bookName"></span><i>OPENING / 01</i></div>
  <section class="st-paper">
    <div class="st-corners" aria-hidden="true">{{corners}}</div>
    <main class="st-flow" data-reader-flow="body" data-reader-flow-pagination="columns"></main>
  </section>
  {{footer}}
</article>
