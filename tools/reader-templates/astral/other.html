<article class="st-page st-voyage">
  <div class="st-edge-stars" aria-hidden="true"></div>
  <header class="st-console">
    <div class="st-firmament" aria-hidden="true">{{starfield}}</div>
    <div class="st-mini-orrery" aria-hidden="true">{{astrolabe}}</div>
    <div class="st-console-copy"><span class="st-eyebrow">THE ASTRAL ARCHIVE</span><strong data-reader-field="bookName"></strong><span class="st-console-title" data-reader-field="chapterTitle"></span></div>
    <span class="st-coordinate">∞ / <b class="st-sector-number">01</b></span>
    <div class="st-meteor" aria-hidden="true"></div>
  </header>
  <div class="st-bookline"><span class="st-small-star" aria-hidden="true">✧</span><span class="st-sector-name">猎户之境</span><i>READ AMONG THE STARS</i></div>
  <section class="st-paper">
    <div class="st-corners" aria-hidden="true">{{corners}}</div>
    <main class="st-flow" data-reader-flow="body" data-reader-flow-pagination="columns"></main>
  </section>
  {{footer}}
</article>
