<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legado · Upload</title>
<link rel="stylesheet" href="../assets/web-theme.css"><script src="../assets/web-i18n.js"></script><script src="../assets/web-theme.js"></script>
<style>.upload-page{max-width:960px;margin:auto;padding:32px clamp(16px,4vw,48px) 56px}.upload-page h1{font-size:28px;margin:0 0 8px}.upload-page p{color:var(--muted)}.drop-zone{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:44px 20px;margin:28px 0}.drop-zone.dragging{border-color:var(--accent);background:var(--accent-soft)}.drop-zone strong{font-size:18px}.upload-page button{padding:10px 16px;border:var(--border-ui);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit}.upload-page .primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}.upload-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,auto);gap:16px;border-bottom:var(--border-ui);padding:16px 0}.upload-name{overflow-wrap:anywhere}.upload-status{color:var(--muted);text-align:right}.upload-row progress{width:100%;grid-column:1/-1;height:5px}.upload-actions{display:flex;justify-content:flex-end;margin:20px 0}#upload-error{overflow-wrap:anywhere}button:disabled{opacity:.5}</style></head>
<body><div id="web-service-header"></div><main class="upload-page"><h1 data-i18n="Gửi sách">Gửi sách</h1><p data-i18n="Tệp sách được gửi vào ứng dụng trên điện thoại."></p>
<section id="drop-zone" class="drop-zone"><strong data-i18n="Kéo thả sách vào đây"></strong><span data-i18n="TXT hoặc EPUB · nhiều tệp"></span><button id="choose-files" class="primary" type="button" data-i18n="Chọn tệp"></button><input id="book-files" type="file" accept=".txt,.epub" multiple hidden></section>
<p id="upload-error" role="alert"></p><div id="upload-list" aria-live="polite"></div><p id="upload-empty" data-i18n="Chưa có tệp nào."></p><div class="upload-actions"><button id="retry" type="button" data-i18n="Thử lại các tệp lỗi" hidden></button></div></main>
<script>
(() => {
 const ui=window.LegadoWebUi, input=document.getElementById('book-files'),zone=document.getElementById('drop-zone'),list=document.getElementById('upload-list'),retry=document.getElementById('retry'),error=document.getElementById('upload-error');
 const items=[];let running=false,invalid=false;
 function render(){
  list.replaceChildren();document.getElementById('upload-empty').hidden=items.length>0;retry.hidden=!items.some(i=>i.state==='failed');retry.disabled=running;
  error.textContent=invalid?ui.t('Chỉ hỗ trợ tệp TXT và EPUB.'):'';document.title=ui.t('Gửi sách')+' · Legado';
  for(const item of items){const row=document.createElement('div');row.className='upload-row';const name=document.createElement('span');name.className='upload-name';name.textContent=item.file.name;const status=document.createElement('span');status.className='upload-status';status.textContent=ui.t({queued:'Đang chờ',sending:'Đang gửi…',done:'Đã gửi',failed:'Gửi thất bại'}[item.state]);row.append(name,status);if(item.state==='sending'){const p=document.createElement('progress');p.max=100;p.value=item.progress;row.append(p);}list.append(row);}
 }
 function send(item){return new Promise(resolve=>{
  const xhr=new XMLHttpRequest(),form=new FormData();form.append('fileName',item.file.name);form.append('fileData',item.file);xhr.open('POST','../addLocalBook');xhr.timeout=120000;
  xhr.upload.onprogress=e=>{if(e.lengthComputable){item.progress=Math.round(e.loaded/e.total*100);render();}};
  const finish=ok=>{item.state=ok?'done':'failed';render();resolve();};
  xhr.onload=()=>{let ok=false;try{ok=xhr.status>=200&&xhr.status<300&&JSON.parse(xhr.responseText).isSuccess===true;}catch{}finish(ok);};xhr.onerror=xhr.ontimeout=xhr.onabort=()=>finish(false);xhr.send(form);
 });}
 async function process(){if(running)return;running=true;render();try{for(const item of items){if(item.state==='queued'){item.state='sending';render();await send(item);}}}finally{running=false;render();}}
 function add(files){invalid=false;for(const file of files){if(!/\.(txt|epub)$/i.test(file.name)){invalid=true;continue;}items.push({file,state:'queued',progress:0});}render();void process();}
 document.getElementById('choose-files').onclick=()=>input.click();input.onchange=()=>{add(input.files);input.value='';};
 for(const event of ['dragenter','dragover'])zone.addEventListener(event,e=>{e.preventDefault();zone.classList.add('dragging');});
 for(const event of ['dragleave','drop'])zone.addEventListener(event,e=>{e.preventDefault();zone.classList.remove('dragging');});zone.addEventListener('drop',e=>add(e.dataTransfer.files));
 retry.onclick=()=>{items.filter(i=>i.state==='failed').forEach(i=>{i.state='queued';i.progress=0;});void process();};addEventListener('legado-language-change',render);render();
})();
</script></body></html>
