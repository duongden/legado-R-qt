<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>.help-page { display:grid; grid-template-columns:240px minmax(0,1fr); gap:28px; max-width:1200px; padding:28px clamp(16px,4vw,48px) 56px; margin:auto; }.help-sidebar { align-self:start; position:sticky; top:88px; max-height:calc(100dvh - 112px); overflow:auto; }.help-sidebar h1 { font-size:20px; margin:0 0 16px; }.help-sidebar input { width:100%; padding:10px; border:var(--border-ui); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; margin-bottom:12px; }.help-sidebar nav { display:grid; gap:2px; }.help-sidebar a { color:var(--muted); padding:8px 10px; text-decoration:none; border-radius:7px; font-size:13px; line-height:1.6; overflow-wrap:anywhere; }.help-sidebar a[aria-current=page] { color:var(--accent); background:var(--accent-soft); }.help-error { padding:24px; border:var(--border-ui); border-radius:10px; }@media(max-width:700px){.help-page{grid-template-columns:1fr;gap:20px;}.help-sidebar{position:static;max-height:none;}.help-sidebar nav{display:flex;overflow:auto;max-height:130px;flex-wrap:wrap;}.help-sidebar a{white-space:normal;}.help-sidebar h1{font-size:24px;}}</style>
